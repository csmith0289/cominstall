# Netlify build settings. They override the ones in Netlify's dashboard. Same as Batch & Label.
# `vercel-build` applies the Drizzle migrations to the database in DATABASE_URL, then runs `next build`.
# Its name is left over from Vercel; it works on any host.
[build]
  command = "pnpm vercel-build"
  publish = ".next"
  # Builds are OFF until go-live (step 5 of the setup guide), so the ticket loop's merges don't use Netlify credits.
  # An ignore command that exits 0 tells Netlify to skip the build. To turn builds back on, delete this line.
  ignore = "exit 0"
